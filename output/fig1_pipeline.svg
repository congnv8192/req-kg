<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#5B6E73"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#0E7C7B"/>
    </marker>
  </defs>
  <style>
    .box{fill:#ffffff;stroke:#7A8B90;stroke-width:1.3;rx:9;}
    .det{fill:#EAF3F2;stroke:#2A9D8F;stroke-width:1.4;}
    .llm{fill:#FBEEDC;stroke:#E08214;stroke-width:1.4;}
    .out{fill:#E7EFF8;stroke:#3B6FB6;stroke-width:1.4;}
    .t{font-size:12.5px;fill:#152227;}
    .sub{font-size:10px;fill:#5B6E73;}
    .lane{font-size:11px;fill:#8A9B9F;font-style:italic;}
    .edge{stroke:#5B6E73;stroke-width:1.4;fill:none;}
    .cor{stroke:#0E7C7B;stroke-width:1.5;fill:none;stroke-dasharray:5 3;}
    .lab{font-size:11px;fill:#0A5150;}
  </style>

  <!-- lane labels -->
  <text x="14" y="60" class="lane">requirement path</text>
  <text x="14" y="250" class="lane">code path (deterministic)</text>

  <!-- TOP LANE: requirement -> G_req -->
  <rect class="box" x="20" y="72" width="150" height="56" rx="9"/>
  <text x="95" y="96" class="t" text-anchor="middle">Requirement</text>
  <text x="95" y="113" class="sub" text-anchor="middle">README = SRS</text>

  <rect class="box" x="205" y="72" width="150" height="56" rx="9"/>
  <text x="280" y="93" class="t" text-anchor="middle">Cut by taxonomy</text>
  <text x="280" y="110" class="sub" text-anchor="middle">L1 ≺ L2 ≺ L3</text>
  <text x="280" y="122" class="sub" text-anchor="middle">(rule-based, reproducible)</text>

  <rect class="llm" x="390" y="72" width="150" height="56" rx="9"/>
  <text x="465" y="93" class="t" text-anchor="middle">LLM extract</text>
  <text x="465" y="110" class="sub" text-anchor="middle">faithful extractor</text>
  <text x="465" y="122" class="sub" text-anchor="middle">(fixed schema)</text>

  <rect class="out" x="575" y="72" width="120" height="56" rx="9"/>
  <text x="635" y="97" class="t" text-anchor="middle">G_req</text>
  <text x="635" y="114" class="sub" text-anchor="middle">per level</text>

  <!-- BOTTOM LANE: code -> G_code -->
  <rect class="box" x="20" y="200" width="150" height="56" rx="9"/>
  <text x="95" y="224" class="t" text-anchor="middle">Reference code</text>
  <text x="95" y="241" class="sub" text-anchor="middle">golden oracle</text>

  <rect class="det" x="205" y="200" width="150" height="56" rx="9"/>
  <text x="280" y="221" class="t" text-anchor="middle">tree-sitter</text>
  <text x="280" y="238" class="sub" text-anchor="middle">generic call tree</text>
  <text x="280" y="250" class="sub" text-anchor="middle">(framework-agnostic)</text>

  <rect class="det" x="390" y="200" width="120" height="56" rx="9"/>
  <text x="450" y="225" class="t" text-anchor="middle">G_code</text>
  <text x="450" y="242" class="sub" text-anchor="middle">gold</text>

  <!-- MERGE: responsibility set -->
  <rect class="box" x="575" y="164" width="150" height="70" rx="9" fill="#F7FAFA"/>
  <text x="650" y="188" class="t" text-anchor="middle">Responsibility</text>
  <text x="650" y="204" class="t" text-anchor="middle">set  R</text>
  <text x="650" y="221" class="sub" text-anchor="middle">layer ∩ taxonomy</text>

  <!-- CRITERIA -->
  <rect class="out" x="765" y="150" width="215" height="98" rx="9"/>
  <text x="872" y="172" class="t" text-anchor="middle" font-weight="bold">Four criteria</text>
  <text x="872" y="192" class="sub" text-anchor="middle">Coverage · Precision</text>
  <text x="872" y="207" class="sub" text-anchor="middle">Consistency</text>
  <text x="872" y="222" class="sub" text-anchor="middle">Implicit-coverage ★</text>
  <text x="872" y="239" class="sub" text-anchor="middle">(FR / NFR split)</text>

  <!-- DOWNSTREAM: code gen -> pass@k -->
  <rect class="llm" x="575" y="330" width="150" height="52" rx="9"/>
  <text x="650" y="352" class="t" text-anchor="middle">LLM generate</text>
  <text x="650" y="369" class="sub" text-anchor="middle">code per level</text>

  <rect class="out" x="765" y="330" width="215" height="52" rx="9"/>
  <text x="872" y="352" class="t" text-anchor="middle">pass@k</text>
  <text x="872" y="369" class="sub" text-anchor="middle">black-box tests (fair)</text>

  <!-- EDGES top -->
  <line class="edge" x1="170" y1="100" x2="203" y2="100" marker-end="url(#arr)"/>
  <line class="edge" x1="355" y1="100" x2="388" y2="100" marker-end="url(#arr)"/>
  <line class="edge" x1="540" y1="100" x2="573" y2="100" marker-end="url(#arr)"/>
  <!-- edges bottom -->
  <line class="edge" x1="170" y1="228" x2="203" y2="228" marker-end="url(#arr)"/>
  <line class="edge" x1="355" y1="228" x2="388" y2="228" marker-end="url(#arr)"/>
  <!-- into responsibility set -->
  <path class="edge" d="M635,128 L635,150 Q635,164 650,164" marker-end="url(#arr)"/>
  <path class="edge" d="M510,228 Q560,228 575,210" marker-end="url(#arr)"/>
  <!-- R -> criteria -->
  <line class="edge" x1="725" y1="199" x2="763" y2="199" marker-end="url(#arr)"/>
  <!-- G_req -> generate (downstream) -->
  <path class="edge" d="M635,128 L635,300 Q635,330 650,330" marker-end="url(#arr)" opacity="0.55"/>
  <!-- generate -> pass@k -->
  <line class="edge" x1="725" y1="356" x2="763" y2="356" marker-end="url(#arr)"/>
  <!-- correlation criteria <-> pass@k -->
  <path class="cor" d="M872,248 L872,330" marker-end="url(#arrT)"/>
  <text x="884" y="295" class="lab">correlate</text>
  <text x="884" y="309" class="lab">(RQ5)</text>

  <!-- title strip -->
  <text x="20" y="410" class="sub">Deterministic except at LLM extraction/generation (orange). Intrinsic criteria (top-right) are correlated with downstream pass@k (bottom-right).</text>
</svg>
